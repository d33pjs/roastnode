      methodology_title: How this collection is ranked
      methodology: The bag rating averages the recorded coffee ratings of all included published bags equally, regardless of bag size. The brew average includes every rated brew from those bags. Missing ratings are omitted, never counted as zero. Coffees are ordered by bag rating, then brew average, then the number of rated brews. Coffees matching on all three share a rank; the Top 10 includes all coffees tied at the cutoff. Unrated coffees appear in All coffees without a rank.
      disclaimer: This collection reflects personal tasting and preparation experience with the approved published bags. Recorded prices include their currency and date when available; they are historical observations, not current offers or availability. Links marked as affiliate links may support the publisher.

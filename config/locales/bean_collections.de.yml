      empty_body: In dieser Sammlung gibt es noch keine veröffentlichten Kaffees. Schau nach der nächsten Verkostung wieder vorbei.
      methodology_title: So entsteht die Rangliste
      methodology: Die Tütenbewertung ist der gleich gewichtete Durchschnitt der erfassten Kaffeebewertungen aller aufgenommenen veröffentlichten Tüten, unabhängig von ihrer Größe. Der Brühdurchschnitt umfasst jeden bewerteten Bezug dieser Tüten. Fehlende Bewertungen werden ausgelassen und zählen nie als null. Sortiert wird nach Tütenbewertung, dann Brühdurchschnitt und schließlich der Anzahl bewerteter Bezüge. Stimmen alle drei Werte überein, teilen sich die Kaffees einen Rang; die Top 10 enthält alle Kaffees mit Gleichstand an der Grenze. Unbewertete Kaffees erscheinen ohne Rang unter „Alle Kaffees“.
      disclaimer: Diese Sammlung zeigt persönliche Verkostungs- und Zubereitungserfahrungen mit den freigegebenen veröffentlichten Tüten. Erfasste Preise nennen Währung und Datum, sofern vorhanden; sie sind historische Angaben und keine aktuellen Angebote oder Verfügbarkeitsangaben. Als Affiliate-Links gekennzeichnete Links können den Herausgeber unterstützen.

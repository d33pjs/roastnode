      representative_help: Wähle pro Kaffee eine repräsentative Tüte für Titelbild und Kaffeedetails. Bei mehreren gewählten Tüten wird eine nach einer festen Reihenfolge bestimmt. Alle aufgenommenen Tüten zählen weiterhin zur Bewertung.

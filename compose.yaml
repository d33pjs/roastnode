services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roastnode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roastnode}
      POSTGRES_DB: ${POSTGRES_DB:-roastnode_development}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roastnode} -d ${POSTGRES_DB:-roastnode_development}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

name: Gitea CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Rails checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby
        run: bin/rubocop

      - name: Audit gems
        run: bin/bundler-audit

      - name: Audit importmap dependencies
        run: bin/importmap audit

      - name: Scan Rails security
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Run Rails tests
        run: bin/rails db:test:prepare test

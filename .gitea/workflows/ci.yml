name: Gitea CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Rails checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432
      RUBOCOP_CACHE_ROOT: tmp/rubocop
      SOURCE_SYFT_SPDX_SBOM: roastnode-source-${{ github.sha }}.syft.spdx.json
      SOURCE_SYFT_CDX_SBOM: roastnode-source-${{ github.sha }}.syft.cdx.json
      SOURCE_CDX_CDX_SBOM: roastnode-source-${{ github.sha }}.cdxgen.cdx.json
      SOURCE_MIKEBOM_SPDX_SBOM: roastnode-source-${{ github.sha }}.mikebom.spdx3.json
      SOURCE_MIKEBOM_CDX_SBOM: roastnode-source-${{ github.sha }}.mikebom.cdx.json
      CDXGEN_VERSION: v13.4.0
      CDXGEN_SHA256: 2f8911129b773cf45a93cdab2e2578e3a0bdc6f0227b2a77ada62625c00ae1ed
      WAYBILL_VERSION: v0.11.0
      WAYBILL_SHA256: 46f2b90745148ba64b5e75df1cbf6e04dd9d754c64c7b4c2c2a773c08d6d59b0
      EXODOS_API_TOKEN: ${{ secrets.EXODOS_API_TOKEN }}
      EXODOS_API_URL: ${{ vars.EXODOS_API_URL }}
      EXODOS_INVENTORYROOT_SYFT_SPDX_ID: ${{ vars.EXODOS_INVENTORYROOT_SYFT_SPDX_ID }}
      EXODOS_INVENTORYROOT_SYFT_CDX_ID: ${{ vars.EXODOS_INVENTORYROOT_SYFT_CDX_ID }}
      EXODOS_INVENTORYROOT_CDX_CDX_ID: ${{ vars.EXODOS_INVENTORYROOT_CDX_CDX_ID }}
      EXODOS_INVENTORYROOT_MIKEBOM_SPDX_ID: ${{ vars.EXODOS_INVENTORYROOT_MIKEBOM_SPDX_ID }}
      EXODOS_INVENTORYROOT_MIKEBOM_CDX_ID: ${{ vars.EXODOS_INVENTORYROOT_MIKEBOM_CDX_ID }}

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up ruby
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          rubygems: "4.0.23"
          bundler-cache: true

      - name: Set up Node for JavaScript tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"

      - name: Test JavaScript controllers
        run: node --test test/javascript/*.mjs

      - name: Lint Ruby
        run: bin/rubocop

      - name: Audit gems
        run: bin/bundler-audit

      - name: Audit importmap dependencies
        run: bin/importmap audit

      - name: Scan Rails security
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Run Rails tests
        run: bin/rails db:test:prepare test

      - name: Generate source Syft SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
          format: spdx-json
          output-file: ${{ env.SOURCE_SYFT_SPDX_SBOM }}
          artifact-name: ${{ env.SOURCE_SYFT_SPDX_SBOM }}
          upload-artifact: false

      - name: Upload source Syft SPDX SBOM to exodos.io
        if: ${{ env.EXODOS_API_TOKEN != '' && env.EXODOS_INVENTORYROOT_SYFT_SPDX_ID != '' }}
        run: |
          set -euo pipefail

          api_url="${EXODOS_API_URL:-https://api.exodos.io}"
          curl -fsS -X POST "${api_url}/api/v1/boms/inventory/bom/upload" \
            -H "X-API-Key: ${EXODOS_API_TOKEN}" \
            -H "accept: application/json" \
            -F "params={\"inventoryroot_id\":\"${EXODOS_INVENTORYROOT_SYFT_SPDX_ID}\",\"tags\":[\"roastnode\",\"source\",\"syft\",\"spdx\",\"sha-${GITHUB_SHA}\",{\"name\":\"latest-source-syft-spdx\",\"unique\":true}]}" \
            -F "file=@${SOURCE_SYFT_SPDX_SBOM};type=application/json"

      - name: Generate source Syft CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
          format: cyclonedx-json
          output-file: ${{ env.SOURCE_SYFT_CDX_SBOM }}
          artifact-name: ${{ env.SOURCE_SYFT_CDX_SBOM }}
          upload-artifact: false

      - name: Upload source Syft CycloneDX SBOM to exodos.io
        if: ${{ env.EXODOS_API_TOKEN != '' && env.EXODOS_INVENTORYROOT_SYFT_CDX_ID != '' }}
        run: |
          set -euo pipefail

          api_url="${EXODOS_API_URL:-https://api.exodos.io}"
          curl -fsS -X POST "${api_url}/api/v1/boms/inventory/bom/upload" \
            -H "X-API-Key: ${EXODOS_API_TOKEN}" \
            -H "accept: application/json" \
            -F "params={\"inventoryroot_id\":\"${EXODOS_INVENTORYROOT_SYFT_CDX_ID}\",\"tags\":[\"roastnode\",\"source\",\"syft\",\"cyclonedx\",\"sha-${GITHUB_SHA}\",{\"name\":\"latest-source-syft-cyclonedx\",\"unique\":true}]}" \
            -F "file=@${SOURCE_SYFT_CDX_SBOM};type=application/json"

      # Generate SBOM via cdxgen
      - name: Download cdxgen Open Source Binary
        run: |
          set -euo pipefail

          download_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/roastnode-cdxgen.XXXXXX")"
          mkdir -p "$HOME/.local/bin"
          asset="cdxgen-linux-amd64"
          asset_path="${download_dir}/${asset}"
          curl -fsSL "https://github.com/cdxgen/cdxgen/releases/download/${CDXGEN_VERSION}/${asset}" -o "$asset_path"
          printf '%s  %s\n' "$CDXGEN_SHA256" "$asset_path" | sha256sum -c -
          install -m 0755 "$asset_path" "$HOME/.local/bin/cdxgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cdxgen" --version

      - name: Generate SBOM via cdxgen binary
        run: cdxgen --spec-version 1.6 --no-install-deps -o "${SOURCE_CDX_CDX_SBOM}" .

      - name: Upload source cdxgen CycloneDX SBOM to exodos.io
        if: ${{ env.EXODOS_API_TOKEN != '' && env.EXODOS_INVENTORYROOT_CDX_CDX_ID != '' }}
        run: |
          set -euo pipefail

          api_url="${EXODOS_API_URL:-https://api.exodos.io}"
          curl -fsS -X POST "${api_url}/api/v1/boms/inventory/bom/upload" \
            -H "X-API-Key: ${EXODOS_API_TOKEN}" \
            -H "accept: application/json" \
            -F "params={\"inventoryroot_id\":\"${EXODOS_INVENTORYROOT_CDX_CDX_ID}\",\"tags\":[\"roastnode\",\"source\",\"cdxgen\",\"cyclonedx\",\"sha-${GITHUB_SHA}\",{\"name\":\"latest-source-cdxgen-cyclonedx\",\"unique\":true}]}" \
            -F "file=@${SOURCE_CDX_CDX_SBOM};type=application/json"

      # Generate SBOMs via Waybill, the renamed successor to mikebom.
      - name: Download Waybill Open Source Binary
        run: |
          set -euo pipefail

          download_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/roastnode-waybill.XXXXXX")"
          mkdir -p "$HOME/.local/bin"
          asset="waybill-${WAYBILL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          extract_dir="${asset%.tar.gz}"
          asset_path="${download_dir}/${asset}"
          curl -fsSL "https://github.com/kusari-oss/waybill/releases/download/${WAYBILL_VERSION}/${asset}" -o "$asset_path"
          printf '%s  %s\n' "$WAYBILL_SHA256" "$asset_path" | sha256sum -c -
          tar -xzf "$asset_path" -C "$download_dir"
          install -m 0755 "${download_dir}/${extract_dir}/waybill" "$HOME/.local/bin/waybill"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/waybill" --version

      - name: Generate source Waybill SBOM
        run: |
          set -euo pipefail

          waybill --offline sbom scan \
            --path . \
            --format cyclonedx-json,spdx-3-json \
            --output cyclonedx-json="${SOURCE_MIKEBOM_CDX_SBOM}" \
            --output spdx-3-json="${SOURCE_MIKEBOM_SPDX_SBOM}"

      - name: Upload source Waybill SPDX SBOM to exodos.io
        if: ${{ env.EXODOS_API_TOKEN != '' && env.EXODOS_INVENTORYROOT_MIKEBOM_SPDX_ID != '' }}
        run: |
          set -euo pipefail

          api_url="${EXODOS_API_URL:-https://api.exodos.io}"
          curl -fsS -X POST "${api_url}/api/v1/boms/inventory/bom/upload" \
            -H "X-API-Key: ${EXODOS_API_TOKEN}" \
            -H "accept: application/json" \
            -F "params={\"inventoryroot_id\":\"${EXODOS_INVENTORYROOT_MIKEBOM_SPDX_ID}\",\"tags\":[\"roastnode\",\"source\",\"mikebom\",\"spdx\",\"spdx-3.0.1\",\"sha-${GITHUB_SHA}\",{\"name\":\"latest-source-mikebom-spdx\",\"unique\":true}]}" \
            -F "file=@${SOURCE_MIKEBOM_SPDX_SBOM};type=application/json"

      - name: Upload source Waybill CycloneDX SBOM to exodos.io
        if: ${{ env.EXODOS_API_TOKEN != '' && env.EXODOS_INVENTORYROOT_MIKEBOM_CDX_ID != '' }}
        run: |
          set -euo pipefail

          api_url="${EXODOS_API_URL:-https://api.exodos.io}"
          curl -fsS -X POST "${api_url}/api/v1/boms/inventory/bom/upload" \
            -H "X-API-Key: ${EXODOS_API_TOKEN}" \
            -H "accept: application/json" \
            -F "params={\"inventoryroot_id\":\"${EXODOS_INVENTORYROOT_MIKEBOM_CDX_ID}\",\"tags\":[\"roastnode\",\"source\",\"mikebom\",\"cyclonedx\",\"cyclonedx-1.6\",\"sha-${GITHUB_SHA}\",{\"name\":\"latest-source-mikebom-cyclonedx\",\"unique\":true}]}" \
            -F "file=@${SOURCE_MIKEBOM_CDX_SBOM};type=application/json"
